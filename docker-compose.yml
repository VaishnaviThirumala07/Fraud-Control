services:
  dev:
    build:
      context: .
    working_dir: /app
    command: sh -c "sleep infinity"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
      - "8000:8000"

  redpanda:
    image: docker.io/redpandadata/redpanda:v23.2.14
    container_name: redpanda
    # Keep the development broker from consuming all Docker Desktop resources.
    cpus: 1.0
    mem_limit: 1g
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://localhost:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --schema-registry-addr 0.0.0.0:8081
      - --mode dev-container
      - --smp 1
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"

  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j
    # Bound Neo4j's JVM and container resources for local development.
    cpus: 1.0
    mem_limit: 1g
    environment:
      - NEO4J_AUTH=neo4j/fraudcontrol
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  frontend_node_modules:
  neo4j_data:
